# FeedSieve 推荐白名单（金刚防护罩）
#
# 名单内账号永远不会被标注或拉黑：扩展对 whitelist 一票否决，优先级高于一切检测来源
# （社区名单 / 指纹 / 域名 / 词库）。与社区黑名单互斥——命中白名单的账号不进黑名单。
#
# 怎么提交：
#   1. PR 修改本文件 entries 区，每条必须附带入册说明（note，4-240 字，公开问责用）
#   2. 维护者审核后合并（入册标准：误标申诉经核实、知名正常账号等；不接受匿名批量提交）
#   3. 合并后运行 scripts/publish-community-whitelist.sh 发布，下一次快照即生效
#      （快照按「当日一版」节流，白名单变化也会触发新版本）
#
# entries 字段：
#   handle    必填。@ 后面的用户名（@ 可带可不带，脚本自动归一为小写）
#   note      必填。为什么这个账号值得豁免（会随快照公开）
#   x_user_id 选填。账号数字 ID，能填则填（改名前仍可识别）
