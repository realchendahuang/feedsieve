# FeedSieve 社区黑名单政策 v4 —— 公开事实源（2026-10-31 起，取代 v3）
version: 4
updated_at: '2026-10-31T00:00:00Z'

description: >-
  每个安装对每个账号只有一个当前选择：拉黑或误标。净票（拉黑票 − 误标票）达到 3，
  并且有一条独立性证据（拉黑票横跨 2 天、加权共识达标、或净票达到 5）时进入最终黑名单；
  条件不再满足时自动退出。本地规则的命中会匿名上报，但命中不是票，只能给已有 2 张人工净票、
  没有误标票的账号作独立佐证。探活确认已注销或冻结的账号不再下发。
  名单命中和批量拉黑不会反向生成社区票。

community_blocklist:
  formula: block_votes - false_positive_votes
  min_net_votes: 3
  one_current_vote_per_installation: true
  # 净票达标之外还要满足其一，挡住「同一天冒出来的几个新安装」
  independence:
    consensus_v2_strong: true
    min_distinct_days: 2
    unconditional_net_votes: 5
  # 佐证上榜：规则命中来自多个网段的用户，或同一正文模板的批量号。
  # 网段哈希每天换（跨天无法关联），网段数按「同一天」统计，取 7 天里最多的那一天
  corroborated:
    min_net_votes: 2
    max_false_positive_votes: 0
    min_rule_hit_networks_7d: 3
    same_template_campaign:
      min_accounts: 3
      min_networks: 3
  exclude_dead_accounts: true

# consensus v2：每张票按「安装信任 × 安装成熟度」加权（新安装 7 天内从 0.15 线性爬升到 1），
# 加权净票 ≥ 2.5，且拉黑票横跨 ≥ 2 天或有 ≥ 2 个安装一致的内容指纹 / 外链域名
consensus_v2:
  probation_days: 7
  min_weight: 0.15
  weighted_net_threshold: 2.5
  min_distinct_days: 2

# 规则误伤闭环：按规则统计 14 天内「打黄框的账号」和「点了误标的账号」，
# 误伤率超线自动静音（随签名快照 muted_rules 下发，扩展不再用它标黄框），维护者可恢复。
# 误标只算：窗口内确实被这条规则命中上报过的账号，且来自注册满 7 天的安装；
# 条件连续满足 6 小时才静音
rule_feedback:
  window_days: 14
  auto_mute_min_hit_accounts: 30
  auto_mute_min_false_positive_installs: 5
  auto_mute_false_positive_rate: 0.5
  max_new_mutes_per_run: 5
  hold_hours: 6
  false_positive_min_install_days: 7

# 规则命中上报：只收官方规则和内置启发式，个人自定义关键词不上报；
# 只带每日轮换的随机会话编号和「IP 网段 + 日期」的加盐哈希，21 天后删除
rule_hits:
  retention_days: 21
  session_daily_limit: 2000
  network_daily_limit: 20000

maintainer_source:
  description: >-
    维护者仅可通过受 Cloudflare Access 保护的 React 管理后台维护条目。维护者条目是
    独立且公开标注的来源，不计入社区票数，也不伪装成社区共识。
  weighted_vote: false
  public_source_label: maintainer

# Community Score 只用于解释社区证据强弱，不决定是否进入最终名单。
score:
  saturation: 3
  rescue_deduction: 1
  temporal_spread_bonus_per_extra_day: 0.02
  temporal_spread_bonus_max: 0.1
  burst_min_reports: 5
  burst_penalty_factor: 0.8

reporter_trust:
  default: 1.0
  floor: 0.2
  burst_threshold: 30
  burst_decay: 0.1

limits:
  daily_report_base: 100
  daily_rescue_base: 50
  daily_min: 10
  max_batch: 50
  daily_ip_report_limit: 200
  daily_alias_cap: 10

# 发布：至少隔 25 分钟发一版（cron 每 30 分钟检查），扩展每 30 分钟按增量同步
publishing:
  min_interval_minutes: 25
  version_retention_days: 14
  client_sync_minutes: 30
  delta_sync: true

principles:
  - one_final_blocklist
  - user_undo_always_wins
  - blocking_requires_explicit_user_action
  - report_and_false_positive_are_explicit_actions
  - rule_hits_are_not_votes
  - opinion_disagreement_is_not_spam
  - list_entries_are_not_permanent_sentences
  - maintainer_source_is_publicly_labeled
  - maintainer_does_not_modify_community_votes
  - following_list_stays_local
  - community_batch_does_not_create_reports
