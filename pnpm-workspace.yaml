packages:
  - apps/*
  - packages/*

# esbuild / workerd 的构建脚本需要显式批准（pnpm v10+ 默认不执行依赖构建脚本）。
# pnpm 11 的正式键是 allowBuilds（map 形式）；onlyBuiltDependencies 仅为兼容仍被识别，二选一即可。
allowBuilds:
  esbuild: true
  workerd: true

# 依赖版本钉子：@cloudflare/vite-plugin 的 miniflare 依赖解析到了
# 5.20260910.0-alpha，其 Request 类型与 @cloudflare/workers-types 冲突
# （全部 test/*.test.ts 报 Request 泛型不匹配）——钉回 vitest-plugin 同代的旧 alpha。
overrides:
  '@cloudflare/vite-plugin>miniflare': 5.20260825.0-alpha
