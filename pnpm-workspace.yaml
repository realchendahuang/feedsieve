# 共享依赖版本单一来源（catalog:）：两个 app 引用同一 range，
# 防止 react-router / vite 之类的漂移造成双版本共存。
catalog:
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.5
  '@tanstack/react-router': ^1.170.35
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^1.40.0
  radix-ui: ^1.6.7
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  tw-animate-css: ^1.4.0
  vite: ^8.2.4
  '@vitejs/plugin-react': ^6.1.0

packages:
  - apps/*
  - packages/*

# esbuild / workerd 的构建脚本需要显式批准（pnpm v10+ 默认不执行依赖构建脚本）。
# pnpm 11 的正式键是 allowBuilds（map 形式）；onlyBuiltDependencies 仅为兼容仍被识别，二选一即可。
allowBuilds:
  esbuild: true
  workerd: true

# 依赖版本钉子：@cloudflare/vite-plugin 的 miniflare 依赖解析到了
# 5.20260910.0-alpha，其 Request 类型与 @cloudflare/workers-types 冲突
# （全部 test/*.test.ts 报 Request 泛型不匹配）——钉回 vitest-plugin 同代的旧 alpha。
overrides:
  '@cloudflare/vite-plugin>miniflare': 5.20260825.0-alpha
  sharp: 0.35.5
  # zod <4.6.6 有内存耗尽漏洞（GHSA-mrhx-c7xc-m3w5）；统一到修复版，
  # 避免 TanStack 工具链继续带 4.6.1。
  zod: 4.6.7
  # Dependabot 2026-11：开发依赖链里的安全问题（都不进运行时产物）。
  # undici 7.29.0 由 miniflare 精确锁定；brace-expansion/minimatch 走 eslint；
  # esbuild 0.18 由 drizzle-kit 的 @esbuild-kit 带进来。
  undici: 7.30.1
  brace-expansion: 5.0.12
  minimatch: 11.0.3
  '@esbuild-kit/core-utils>esbuild': 0.25.12
