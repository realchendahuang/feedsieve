name: verify

on:
  pull_request:
  push:
    branches: [main]

# 最小权限：本工作流只读仓库，不需要任何写权限。
permissions:
  contents: read

# 只做仓库级验证门禁：lint / typecheck / 测试 / 构建 / 产物与依赖检查。
# 发布打包（pack-store.sh）与签名私钥都在开发机，不进 CI。
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 省略 version：action 默认读 package.json 的 packageManager 字段，避免两处漂移。

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Keyword pack artifacts (strip-signature compare + built-in key verify)
        run: pnpm keyword-packs:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Community API tests (workerd)
        run: pnpm --filter @feedsieve/community-api test

      - name: Build extension (wxt)
        run: pnpm build:extension

      - name: Install Chromium for MV3 acceptance
        run: pnpm exec playwright install --with-deps chromium

      - name: MV3 offline startup and recovery
        run: node scripts/smoke-extension-runtime.mjs
      - name: Build admin and verify sample review/export
        run: |
          pnpm --filter @feedsieve/admin build
          node scripts/smoke-sample-admin.mjs

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high  # 只审生产依赖：devDependencies 里的 eslint/miniflare/tailwind 传递漏洞不上生产线